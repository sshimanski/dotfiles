<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Alacritty renders through freetype and reads nothing but fontconfig, so this
       file is the only place that decides how the terminal looks.

       Ubuntu 24.04 already enables the first five knobs via /etc/fonts/conf.d
       (10-yes-antialias, 10-hinting-slight, 10-sub-pixel-rgb, 11-lcdfilter-default).
       They are repeated here on purpose: pinned, they survive a distro upgrade that
       changes a default and a fresh machine whose conf.d differs. Verify the result
       with `fc-match -v "DejaVuSansM Nerd Font"` - expect antialias True,
       hintstyle 1 (slight), rgba 1 (rgb), lcdfilter 1 (default). -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>

    <!-- hintslight, not medium/full: it only aligns stems vertically and leaves the
         glyph shape alone, which is what the subpixel filter below needs to work. -->
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>

    <!-- eDP-1 is a standard RGB-striped IPS panel. On a rotated or OLED screen this
         would have to change, hence the note rather than a bare value. -->
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>

    <!-- Not covered by the system files: some CJK fonts carry bitmap strikes that
         freetype prefers over the outline at terminal sizes, and they look broken
         next to an antialiased Nerd Font. -->
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
