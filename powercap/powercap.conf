# Package power limit (PL1) for the i7-11800H in this MSI GF63 Thin 11UC chassis.
# Edited freely, no root needed: cpu-powercap.path notices the write and systemd
# re-applies within a second. Verify with
#   cat /sys/class/powercap/intel-rapl:0/constraint_0_power_limit_uw
#
# Measured on a real Maven build, 90 s samples, package temp and throttle events:
#   no limit  peak 95 C  avg 90 C  3279 MHz  3417 throttle events
#   40 W      peak 95 C  avg 84 C  3088 MHz   686
#   35 W      peak 91 C  avg 83 C  2966 MHz   103   <- the knee, current setting
#   30 W      peak 90 C  avg 71 C  2526 MHz     2
# Losing the throttle events is what removes the fan noise: unlimited, the chip
# hit 100 C and dropped its clock thousands of times a minute.
# Short bursts are unaffected: PL2 stays unlimited, so a single-file compile or
# opening an IDE still runs at full turbo.
WATTS=35

# Burst limit (PL2): what the chip may draw for the few milliseconds before PL1's
# averaging window starts counting. The firmware leaves it at a 200 W placeholder,
# which is where the 90-95 C spikes come from - PL1 cannot see them. 55 W keeps a
# single-file compile or an IDE launch snappy while cutting the spike.
WATTS_BURST=55

# Averaging window. The firmware default is 56 s, long enough that a whole Maven
# module finishes before the limit engages at all - which is why 45 W alone felt
# like it did nothing. 20 s keeps short bursts free but reins in a real build.
WINDOW_S=20
