# picom v10 — Intel UHD TigerLake / modesetting+glamor / X11 / i3
# Replaces `compton -f -D5` (commit 15b5401).

#################################
# Backend
#################################

# glx, not the default xrender: since 17.09.2026 hardware Intel acceleration
# works (Mesa iris + glamor, DRI3). xrender flickers on that pipeline.
backend = "glx";

# Sync with the 144 Hz eDP-1 panel. Without it — tearing.
vsync = true;

# Repaint only the damaged regions — saves battery.
# FIRST CANDIDATE TO DISABLE if flickering shows up anywhere.
use-damage = true;

glx-no-stencil = true;

# Keep fullscreen windows redirected. true buys speed in video/games at the
# price of a blink on every fullscreen enter and exit.
unredir-if-possible = false;

#################################
# Fading — parity with the previous `compton -f -D5`
#################################

fading = true;
fade-delta = 5;
fade-in-step = 0.03;
fade-out-step = 0.03;

# The feh wallpaper and the polybar bar must not fade in.
fade-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'feh'"
];

#################################
# Shadows — off, as under compton (the -c flag was never passed)
#################################

shadow = false;

#################################
# Opacity
#################################

# alacritty draws its own 0.90 through an ARGB visual — picom must not stack
# another layer of opacity on top. Both keys are left at their defaults.
inactive-opacity = 1.0;
frame-opacity = 1.0;

# Honour _NET_WM_WINDOW_OPACITY set by the application itself.
detect-client-opacity = true;

#################################
# Window detection
#################################

detect-rounded-corners = true;
detect-transient = true;
mark-wmwin-focused = true;
mark-ovredir-focused = false;
use-ewmh-active-win = true;

#################################
# Window types
#################################

wintypes:
{
  # polybar
  dock          = { shadow = false; };
  desktop       = { shadow = false; };
  # dunst
  notification  = { shadow = false; };
  # IntelliJ IDEA drop-down menus — Java/AWT ones pick up artifacts when faded
  dropdown_menu = { shadow = false; fade = false; };
  popup_menu    = { shadow = false; fade = false; };
  menu          = { shadow = false; fade = false; };
  utility       = { shadow = false; fade = false; };
  tooltip       = { shadow = false; fade = false; focus = true; };
};

#################################
# Misc
#################################

# Blur is expensive on an Intel iGPU and a flicker source in itself.
# blur-method = "none" is the default, deliberately left alone.

dbus = false;
log-level = "warn";
