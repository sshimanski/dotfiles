# mvnd user config — tuned for this workstation (8C/16T, 62G RAM, i3 desktop).
# https://github.com/apache/maven-mvnd/blob/master/dist/src/main/distro/conf/mvnd.properties

# Build parallelism: bumped from 8 toward full logical thread count — desktop
# background load (IDEA indexing, local Kafka, hiddify) already competes for
# the "free" HT siblings, so under-using threads just loses to that noise.
mvnd.threads = 12

# Dependency-aware parallel builder (default, kept explicit).
mvnd.builder = smart

# Daemon heap. Default is 2G; bumped for comfortable multi-module reactor
# builds without competing too hard with other apps for the 62G available.
mvnd.minHeapSize = 512m
mvnd.maxHeapSize = 12g

# G1 with string dedup keeps long-lived daemon RSS down; force a stable
# locale/encoding so build output doesn't depend on the shell's locale.
mvnd.jvmArgs = -XX:+UseG1GC -XX:+UseStringDeduplication -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US

# Keep the warm daemon around for a full work day instead of the default 3h.
mvnd.idleTimeout = 8h
