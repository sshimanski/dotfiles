# Deliberate deviations from TLP defaults on AC. Copied to /etc/tlp.d/98-local.conf
# (root-owned copy, never a symlink into $HOME), applied with `sudo tlp start`.
# Ordered before 99-pwrsave.conf, which the pwrsave script writes and which only
# carries ON_BAT keys.

# Default is 80 and caps the i7-11800H near 3.7 GHz on AC.
CPU_MAX_PERF_ON_AC=100

# Default is "on", which overrides the NVIDIA udev rule that asks for runtime PM
# and keeps the RTX 3050 and its PCIe port in D0 forever. "auto" lets both reach
# D3cold while Xorg holds the card in PRIME on-demand mode.
RUNTIME_PM_ON_AC=auto
