[general]
# Absolute path on purpose: this file is a symlink into ~/dotfiles, and a
# relative import would be resolved against the link target, not ~/.config.
import = ["/home/administrator/.config/alacritty/themes/themes/gruvbox_dark.toml"]

[font]
size = 11

[font.normal]
family = "DejaVuSansM Nerd Font"
style = "Regular"

[font.bold]
family = "DejaVuSansM Nerd Font"
style = "Bold"

[font.italic]
family = "DejaVuSansM Nerd Font"
style = "Italic"

[selection]
save_to_clipboard = true

[window]
dynamic_title = true
opacity = 0.86

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

# Clipboard and scrollback search: no custom bindings needed.
# Alacritty 0.17 matches Ctrl+Shift+C/V/F/B by physical position, so the stock
# bindings fire on the Russian group too. The scancode bindings that used to sit
# here were additive, not a replacement: both they and the stock binding matched
# the same press and every action ran twice (verified — one Ctrl+Shift+V pasted
# the clipboard twice on both groups).
