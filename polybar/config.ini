; Polybar — one background, colour used as a signal rather than decoration.
; Every module is a coloured Nerd Font glyph plus neutral text; colour takes
; over the whole label only when something needs attention (heat, mute, link
; down, low battery). Icon codepoints are the ones verified for the previous
; revision of this file — all present in "DejaVuSansM Nerd Font".

[colors]
bg   = #1d2021
fg   = #d4be98
dim  = #928374
sep  = #3c3836
teal = #83a598
red  = #fb4934

[bar/main]
width = 100%
height = 30
radius = 0
dpi = 120
background = ${colors.bg}
foreground = ${colors.fg}
line-size = 3
border-size = 0
; spacing in pixels, not in spaces: a space of the mono font-0 is a full
; wide cell, so space-based padding blows up the moment the font changes
padding-left = 8px
padding-right = 8px
module-margin = 6px
separator = "%{F#3c3836}│%{F-}"
; one family for the whole bar; alacritty keeps DejaVu, the bar does not have
; to match it. Propo keeps the icon glyphs at their natural width instead of
; squeezing them into a cell. Nerd Fonts v3 only: ws-icon-2 needs U+F06A9.
font-0 = "CaskaydiaCove Nerd Font Propo:size=10;3"
; font-1 is used by the i3 module only: same family, one step smaller
font-1 = "CaskaydiaCove Nerd Font Propo:size=9;3"
modules-left = i3
modules-right = temperature cpu memory filesystem network vpn pulseaudio battery kbd date tray
cursor-click = pointer
enable-ipc = true

[module/i3]
type = internal/i3
format = <label-state>
index-sort = true
wrapping-scroll = false

; workspace -> icon map (1 console, 2 browser, 3 claude code, 4 chats,
; 5 docker, 6 vpn, 7 misc, 8 htop, 9 music, 10 intellij idea)
ws-icon-0 = "1;"
ws-icon-1 = "2;"
ws-icon-2 = "3;󰚩"
ws-icon-3 = "4;"
ws-icon-4 = "5;"
ws-icon-5 = "6;"
ws-icon-6 = "7;"
ws-icon-7 = "8;"
ws-icon-8 = "9;"
ws-icon-9 = "10;"
ws-icon-default = ""

; focused workspace: bright glyph over a teal underline, not a filled block
label-focused = "%{T2}%icon%%{T-}"
label-focused-foreground = ${colors.fg}
label-focused-underline = ${colors.teal}
label-focused-padding = 6px

label-unfocused = "%{T2}%icon%%{T-}"
label-unfocused-foreground = ${colors.dim}
label-unfocused-padding = 6px

label-visible = "%{T2}%icon%%{T-}"
label-visible-foreground = ${colors.fg}
label-visible-padding = 6px

label-urgent = "%{T2}%icon%%{T-}"
label-urgent-foreground = ${colors.red}
label-urgent-underline = ${colors.red}
label-urgent-padding = 6px

; --- kbdd layout (RU/EN), read from the already-running kbdd daemon ---
[module/kbd]
type = custom/script
exec = ~/dotfiles/polybar/scripts/kbd_layout.sh
tail = true
format = <label>
click-left = dbus-send --dest=ru.gentoo.KbddService /ru/gentoo/KbddService ru.gentoo.kbdd.next_layout
label = "%{F#d3869b}%{F-}%{O2}%output%"

; --- temperature: the whole label goes red past warn-temperature ---
[module/temperature]
type = internal/temperature
hwmon-path = /sys/class/hwmon/hwmon4/temp1_input
base-temperature = 20
warn-temperature = 80
format = <label>
format-warn = <label-warn>
label = "%{F#fb4934}%{F-}%{O2}%temperature-c%"
label-warn = "%{F#fb4934}%{O2}%temperature-c%%{F-}"

; --- cpu_usage ---
[module/cpu]
type = internal/cpu
interval = 3
format = <label>
click-left = alacritty -e bash -ci btop
label = "%{F#fe8019}%{F-}%{O2}%percentage:2%%"

; --- memory ---
[module/memory]
type = internal/memory
interval = 5
format = <label>
click-left = alacritty -e bash -ci btop
label = "%{F#fabd2f}%{F-}%{O2}%gb_used%"

; --- disk ---
[module/filesystem]
type = internal/fs
interval = 10
mount-0 = /
format-mounted = <label-mounted>
click-left = alacritty -e zsh -ci ranger
click-right = baobab
label-mounted = "%{F#b8bb26}%{F-}%{O2}%free%"
label-unmounted = "%{F#928374}%{O2}n/a%{F-}"

; --- iface (active connection is wifi, not the ethernet port) ---
[module/network]
type = internal/network
interface = wlo1
interval = 10
format-connected = <label-connected>
click-left = alacritty -e nmtui
click-right = nm-connection-editor
label-connected = "%{F#8ec07c}%{F-}%{O2}%essid%"
format-disconnected = <label-disconnected>
label-disconnected = "%{F#fb4934}%{O2}down%{F-}"

; --- which tunnel is up: N = nvpn (openvpn), H = hvpn (hiddify) ---
[module/vpn]
type = custom/script
exec = ~/dotfiles/polybar/scripts/vpn.sh
interval = 5
format = <label>

; --- volume: muted goes fully dim, that is the signal ---
[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
click-left = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
click-right = pavucontrol
label-volume = "%{F#83a598}%{F-}%{O2}%percentage%%"
format-muted = <label-muted>
label-muted = "%{F#928374}%{O2}muted%{F-}"

; --- battery: hidden on AC. internal/battery is unusable here — with the
; charge threshold the kernel reports "Not charging" on mains, which polybar
; maps to its discharging state, so the AC test lives in the script ---
[module/battery]
type = custom/script
exec = ~/dotfiles/polybar/scripts/battery.sh
interval = 10
format = <label>

; --- time ---
[module/date]
type = internal/date
interval = 1
date = "[%W] %a %d-%m-%Y"
time = %H:%M:%S
click-left = alacritty -e calcurse
label = "%{F#fabd2f}%date% %time%%{F-}"

; --- system tray (nm-applet, blueman-applet, and anything else currently
; running with a tray icon — Slack/Telegram show up too when they're
; running, no extra bridge needed on this system) ---
[module/tray]
type = internal/tray
tray-spacing = 10

[settings]
screenchange-reload = true
